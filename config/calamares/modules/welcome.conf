---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true

requirements:
    # Storage is validated by the Partitions page. Do not check it here,
    # because a brand-new QEMU disk may have no partitions yet.
    requiredRam:        1.0
    check:
        - ram
        - power
        - root
    # The Partitions module performs the actual storage/target validation.
    # Welcome only blocks on the basic runtime requirements below.
    required:
        - ram
        - root
